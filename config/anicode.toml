[render]
width = 1920
height = 1080
fps = 30
# RGBA, 0 to 1. Transparent so the clip composites over footage in Shotcut.
background = [0.0, 0.0, 0.0, 0.0]
# Scene units visible from the bottom to the top of the frame.
frame_height = 8.0

[timing]
# Length of an `at` block whose marker is not set.
default_block_seconds = 2.0

[golden]
width = 640
height = 360
# Scenes in examples/ that have reference frames in tests/golden/.
scenes = ["basics"]
# Points in each example to check, as fractions of the scene length.
points = [0.0, 0.25, 0.5, 0.75, 1.0]
# Largest allowed difference per color channel (0 to 255).
tolerance = 2
