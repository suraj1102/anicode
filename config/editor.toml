# Settings for anicode-editor.

[window]
# Size when the editor opens, in points: tall, to sit beside a text editor
# on half of the screen.
width = 720.0
height = 960.0
# In a window taller than it is wide, the inspector goes under the preview
# and takes this share of the height at first. Drag its top edge to change
# it. A wider window puts the inspector on the right instead.
inspector_share = 0.45

[preview]
# The preview renders at this fraction of the render size in anicode.toml.
scale = 0.5

[drag]
# Dragged params are rounded to this step (scene units, or radians for
# rotation), so the params file stays readable.
step = 0.001
# Preview pixels around a thin line that still count as clicking it.
hit_slop = 4.0
# Part way through an animation, a drag changes its target by the move
# divided by how far the animation has got. Below this fraction the shape
# barely follows the target, so the editor asks you to scrub later instead.
min_gain = 0.05

[watch]
# How often to check the scene, params and Shotcut project files for
# changes, in seconds.
poll_seconds = 0.25

[history]
# Where undo history is saved, under the project folder. Each scene gets a
# file at the same path as the scene, like examples/drag.toml.
folder = ".anicode/history"

[inspector]
# How much a param field changes per pixel when you drag it.
speed = 0.01
# The command that opens a scene file at a line, for the "Open in editor"
# button. {file} and {line} are filled in. Empty hides the button. For
# example: "code -g {file}:{line}", "zed {file}:{line}" or
# "nvim +{line} {file}" (nvim needs a terminal, so wrap it in one).
open_command = ""
