[package]
name = "anicode-editor"
version.workspace = true
edition.workspace = true

[dependencies]
anicode-core = { version = "0.1.0", path = "../anicode-core" }
anicode-lua = { version = "0.1.0", path = "../anicode-lua" }
anicode-render = { version = "0.1.0", path = "../anicode-render" }
anicode-shotcut = { version = "0.1.0", path = "../anicode-shotcut" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
